<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        .topbar {
            background: #7c3aed;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            margin: 0;
        }

        .back {
            background: white;
            color: #7c3aed;
            padding: 9px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px #cbd5e1;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #7c3aed;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

    </style>

</head>

<body>

    <div class="topbar">

        <h2>
            👨‍🏫 Faculty Portal
        </h2>

        <a
            href="/faculty-dashboard"
            class="back"
        >
            Back
        </a>

    </div>


    <div class="container">

        <div class="box">

            <h1>
                🔐 Change Password
            </h1>

            <p class="subtitle">
                Change your faculty portal password
            </p>


            <form
                method="POST"
            >

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >


                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >


                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >


                <button type="submit">
                    Change Password
                </button>

            </form>

        </div>

    </div>

</body>

</html>
