<!DOCTYPE html>
<html>
<head>

    <title>Course Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* Course row */

        .course {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 10px;
            border-bottom: 1px solid #eee;
            gap: 20px;
        }

        .course:last-child {
            border-bottom: none;
        }

        .course-info {
            flex: 1;
        }

        .course-id {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .course-name {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .department {
            color: #666;
            font-size: 14px;
        }

        /* Edit Delete buttons */

        .course-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            white-space: nowrap;
        }

        .course-actions a {
            text-decoration: none;
            font-size: 15px;
        }

        .edit-btn {
            color: #2563eb;
        }

        .delete-btn {
            color: #dc2626;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .course {
                flex-direction: column;
                align-items: flex-start;
            }

            .course-actions {
                margin-top: 8px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <a href="/admin-dashboard" class="back">
        ← Back to Admin Dashboard
    </a>

    <h1>Course Management</h1>


    <!-- Add Course -->

    <div class="box">

        <h2>Add Course</h2>

        <form method="POST">

            <label>
                Course Name
            </label>

            <input
                type="text"
                name="course_name"
                placeholder="Enter course name"
                required
            >

            <label>
                Department
            </label>

            <select name="department" required>

                <option value="">
                    Select Department
                </option>

                {% for department in departments %}

                    <option value="{{ department.name }}">
                        {{ department.name }}
                    </option>

                {% endfor %}

            </select>

            <button type="submit">
                ➕ Add Course
            </button>

        </form>

    </div>


    <!-- Course List -->

    <div class="box">

        <h2>Course List</h2>

        {% if courses %}

            {% for course in courses %}

                <div class="course">

                    <!-- Course Information -->

                    <div class="course-info">

                        <div class="course-id">
                            {{ course.course_id }}
                        </div>

                        <div class="course-name">
                            {{ course.name }}
                        </div>

                        <div class="department">
                            {{ course.department }}
                        </div>

                    </div>


                    <!-- Actions -->

                    <div class="course-actions">

                        <a
                            href="/edit-course/{{ course.course_id }}"
                            class="edit-btn"
                        >
                            ✏️ Edit
                        </a>

                        <a
                            href="/delete-course/{{ course.course_id }}"
                            class="delete-btn"
                            onclick="return confirm('Are you sure you want to delete this course?');"
                        >
                            🗑️ Delete
                        </a>

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <p>
                No courses added yet.
            </p>

        {% endif %}

    </div>

</div>

</body>
</html>
