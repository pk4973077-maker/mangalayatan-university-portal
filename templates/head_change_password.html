<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change ID & Password</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            margin: 0;

            background: #f1f5f9;

            color: #1e293b;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .box {

            width: 100%;

            max-width: 680px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 8px 25px #cbd5e1;
        }

        h1 {

            text-align: center;

            color: #0891b2;

            margin-top: 0;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 25px;

            font-size: 16px;
        }

        .icon {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;
        }

        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #334155;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #0891b2;
        }

        .update-btn {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #16a34a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .update-btn:hover {

            background: #15803d;
        }

        .back-btn {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 13px;

            border-radius: 8px;

            background: #475569;

            color: white;

            text-decoration: none;

            text-align: center;

            font-weight: bold;
        }

        .back-btn:hover {

            background: #334155;
        }

        .error {

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #991b1b;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            text-align: center;
        }

        @media (max-width: 600px) {

            .box {

                padding: 22px;
            }

        }

    </style>

</head>


<body>


<div class="box">


    <div class="icon">
        🔐
    </div>


    <h1>
        Change ID & Password
    </h1>


    <div class="subtitle">
        Head Portal Credentials
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="/head-change-password"
        onsubmit="return confirm('Are you sure you want to change the Head verification name and password?');"
    >


        <label>
            Current Head Verification Name
        </label>

        <input
            type="text"
            name="current_verification_name"
            placeholder="Enter current verification name"
            required
        >


        <label>
            Current Password
        </label>

        <input
            type="password"
            name="current_password"
            placeholder="Enter current password"
            required
        >


        <label>
            New Head Verification Name
        </label>

        <input
            type="text"
            name="verification_name"
            placeholder="Enter new verification name"
            required
        >


        <label>
            New Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            required
        >


        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >


        <button
            type="submit"
            class="update-btn"
        >
            🔄 Change ID & Password
        </button>


    </form>


    <a
        href="/head"
        class="back-btn"
    >
        ← Back to Head Portal
    </a>


</div>


</body>

</html>
