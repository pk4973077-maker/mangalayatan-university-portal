<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Admin Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;

            padding: 30px;
            border-radius: 14px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #1e3a8a;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 18px;

            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🔐 Change Admin Password</h2>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Current Password</label>
        <input
            type="password"
            name="current_password"
            required
        >

        <label>New Password</label>
        <input
            type="password"
            name="new_password"
            required
        >

        <label>Confirm New Password</label>
        <input
            type="password"
            name="confirm_password"
            required
        >

        <button type="submit">
            Change Password
        </button>

    </form>

    <a href="/admin-dashboard" class="back">
        ← Back to Admin Dashboard
    </a>

</div>

</body>
</html>
