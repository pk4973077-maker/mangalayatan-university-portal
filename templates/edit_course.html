<!DOCTYPE html>
<html>
<head>

    <title>Edit Course</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="/admin-courses" class="back">
        ← Back to Course Management
    </a>

    <div class="box">

        <h1>Edit Course</h1>

        <form method="POST">

            <label>
                Course Name
            </label>

            <input
                type="text"
                name="course_name"
                value="{{ course.name }}"
                required
            >

            <label>
                Department
            </label>

            <select name="department" required>

                {% for department in departments %}

                    <option
                        value="{{ department.name }}"
                        {% if department.name == course.department %}
                        selected
                        {% endif %}
                    >
                        {{ department.name }}
                    </option>

                {% endfor %}

            </select>

            <button type="submit">
                💾 Save Changes
            </button>

        </form>

    </div>

</div>

</body>
</html>
