<!DOCTYPE html>
<html>
<head>

    <title>Exam Arrangement Login</title>

    <meta
        charset="UTF-8"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f1f5fb;
        }

        .login-box {

            width: 420px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.12);

        }

        h1 {

            text-align: center;

            color: #1d4685;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 28px;

        }

        label {

            display: block;

            font-weight: bold;

            margin-top: 16px;

            margin-bottom: 7px;

        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1d4685;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            opacity: 0.9;

        }

        .error {

            margin-top: 15px;

            padding: 10px;

            background: #ffe5e5;

            color: #b00020;

            border-radius: 7px;

            text-align: center;

        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>
        Exam Arrangement
    </h1>

    <div class="subtitle">
        Login to continue
    </div>

    <form
        method="POST"
    >

        <label>
            Verification Name
        </label>

        <input
            type="text"
            name="verification_name"
            placeholder="Enter verification name"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button
            type="submit"
        >
            Login
        </button>

    </form>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

</div>

</body>
</html>
