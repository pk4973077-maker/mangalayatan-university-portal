<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Portal</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: #7c3aed;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            padding: 11px 18px;
            background: #64748b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .welcome {
            background: white;
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .icon {
            font-size: 60px;
        }

        .welcome h2 {
            color: #7c3aed;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>👑 Owner Portal</h1>
        <p>University Management System</p>
    </div>

    <div class="container">

        <a href="/" class="back">
            ← Back to Select Portal
        </a>

        <div class="welcome">

            <div class="icon">
                👑
            </div>

            <h2>
                Welcome to Owner Portal
            </h2>

            <p>
                Owner management features will be added here.
            </p>

        </div>

    </div>

</body>

</html>
