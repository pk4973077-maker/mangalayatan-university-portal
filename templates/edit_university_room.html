<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit University Room</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #173b7a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            font-size: 30px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .box h2 {
            color: #173b7a;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-btn,
        .cancel-btn {
            padding: 12px 22px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn {
            background: #173b7a;
            color: white;
        }

        .cancel-btn {
            background: #777;
            color: white;
        }

    </style>

</head>

<body>


    <div class="header">

        <h1>
            Edit University Room
        </h1>

    </div>


    <div class="container">

        <div class="box">

            <h2>
                Edit Room Details
            </h2>


            <form
                method="POST"
                action="/edit-university-room/{{ index }}">


                <div class="field">

                    <label>
                        Room Name
                    </label>

                    <input
                        type="text"
                        name="room_name"
                        value="{{ room.room_name }}"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Capacity
                    </label>

                    <input
                        type="number"
                        name="capacity"
                        value="{{ room.capacity }}"
                        min="1"
                        required
                    >

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn">

                        Save Changes

                    </button>


                    <a
                        href="/university-room-capacity"
                        class="cancel-btn">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </div>


</body>
</html>
