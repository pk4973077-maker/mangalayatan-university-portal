<!DOCTYPE html>
<html>
<head>

    <title>Change Exam Arrangement Credentials</title>

    <meta
        charset="UTF-8"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f1f5fb;

        }

        .box {

            width: 500px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.12);

        }

        h1 {

            text-align: center;

            color: #1d4685;

            margin-bottom: 25px;

        }

        label {

            display: block;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 7px;

        }

        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1d4685;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #1d4685;

            text-decoration: none;

        }

        .error {

            margin-top: 15px;

            padding: 10px;

            background: #ffe5e5;

            color: #b00020;

            border-radius: 7px;

            text-align: center;

        }

    </style>

</head>

<body>

<div class="box">

    <h1>
        Change ID & Password
    </h1>

    <form
        method="POST"
    >

        <label>
            Current Verification Name
        </label>

        <input
            type="text"
            name="current_name"
            required
        >

        <label>
            Current Password
        </label>

        <input
            type="password"
            name="current_password"
            required
        >

        <label>
            New Verification Name
        </label>

        <input
            type="text"
            name="new_name"
            required
        >

        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            required
        >

        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            required
        >

        <button
            type="submit"
        >
            Change ID & Password
        </button>

    </form>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <a
        href="/exam-arrangement"
        class="back"
    >
        ← Back to Exam Arrangement
    </a>

</div>

</body>
</html>
