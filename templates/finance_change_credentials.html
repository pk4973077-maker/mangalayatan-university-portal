<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Finance ID & Password</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }

        .box {
            width: 92%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #cbd5e1;
        }

        h1 {
            text-align: center;
            color: #16a34a;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 17px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .error {
            margin-top: 18px;
            padding: 12px;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #16a34a;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>🔐 Change ID & Password</h1>

    <div class="subtitle">
        Finance Portal Credentials
    </div>


    <form
        action="/finance-change-credentials"
        method="POST"
    >

        <label>
            Current Finance Verification Name
        </label>

        <input
            type="text"
            name="current_name"
            placeholder="Enter current verification name"
            required
        >


        <label>
            Current Password
        </label>

        <input
            type="password"
            name="current_password"
            placeholder="Enter current password"
            required
        >


        <label>
            New Finance Verification Name
        </label>

        <input
            type="text"
            name="new_name"
            placeholder="Enter new verification name"
            required
        >


        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            required
        >


        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >


        <button type="submit">
            🔄 Change ID & Password
        </button>

    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <a href="/finance" class="back">
        ← Back to Finance Portal
    </a>

</div>

</body>

</html>
