<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Faculty</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: #7c3aed;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #7c3aed;
            font-weight: bold;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        h2 {
            margin-top: 0;
            color: #6d28d9;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>
            👨‍💼 Admin Dashboard
        </h1>

        <p>
            Edit Faculty
        </p>

    </div>


    <div class="container">


        <a
            href="/admin-faculty"
            class="back"
        >
            ← Back to Faculty Management
        </a>


        <div class="box">

            <h2>
                ✏️ Edit Faculty
            </h2>


           <form
    action="/edit-faculty/{{ faculty.faculty_id }}?from={{ from_page }}&q={{ search }}"
    method="POST"
>


                <label>
                    Faculty ID
                </label>

                <input
                    type="text"
                    value="{{ faculty.faculty_id }}"
                    readonly
                >


                <label>
                    Faculty Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ faculty.name }}"
                    placeholder="Enter faculty name"
                    required
                >


                <label>
                    Department
                </label>

                <select
                    name="department"
                    required
                >

                    <option
                        value="DCEA"
                        {% if faculty.department == "DCEA" %}
                        selected
                        {% endif %}
                    >
                        DCEA
                    </option>

                </select>


                <button type="submit">

                    💾 Save Changes

                </button>


            </form>

        </div>


    </div>


</body>

</html>
