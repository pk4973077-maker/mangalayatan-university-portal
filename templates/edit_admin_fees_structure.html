<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Fees Structure</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        .topbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            margin: 0;
        }

        .back {
            background: white;
            color: #1e3a8a;
            padding: 9px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input[readonly] {
            background: #f8fafc;
        }

        button {
            margin-top: 20px;
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #172554;
        }

    </style>

</head>


<body>


    <div class="topbar">

        <h2>✏️ Edit Fees Structure</h2>

        <a
            href="/admin-fees-structure"
            class="back"
        >
            ← Back
        </a>

    </div>


    <div class="container">

        <div class="box">

            <h2>
                Edit Fees Structure
            </h2>


            <form
                method="POST"
                action="/admin-fees-structure/edit/{{ structure.get('id', '') }}"
            >


                <label>
                    Department
                </label>

                <input
                    type="text"
                    value="{{ structure.get('department', '') }}"
                    readonly
                >


                <label>
                    Course
                </label>

                <input
                    type="text"
                    value="{{ structure.get('course', '') }}"
                    readonly
                >


                <label>
                    Semester
                </label>

                <input
                    type="text"
                    value="{{ structure.get('semester', '') }}"
                    readonly
                >


                <label>
                    Total Fees
                </label>

                <input
                    type="number"
                    name="total_fees"
                    value="{{ structure.get('total_fees', 0) }}"
                    min="0"
                    step="0.01"
                    required
                >


                <button type="submit">
                    💾 Update Fees
                </button>

            </form>

        </div>

    </div>


</body>

</html>
