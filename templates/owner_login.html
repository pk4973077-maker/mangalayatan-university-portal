<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;

            padding: 30px;
            border-radius: 14px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #7c3aed;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #7c3aed;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 15px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 18px;

            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>👑 Owner Login</h2>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Verification Name</label>

        <input
            type="text"
            name="verification_name"
            placeholder="Enter Verification Name"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Select Portal
    </a>

</div>

</body>

</html>
