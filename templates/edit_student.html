<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 7px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        h2 {
            margin-top: 0;
            color: #1e3a8a;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .optional {
            font-weight: normal;
            color: #64748b;
            font-size: 13px;
        }

        .optional-note {
            margin-top: 5px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.4;
        }

        .section-group-info {
            margin-top: 18px;
            padding: 12px;
            background: #fff7ed;
            color: #9a3412;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .update-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #172554;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #1e3a8a;
            font-weight: bold;
        }

        .student-id {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .student-id strong {
            color: #334155;
        }

        @media (max-width: 650px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .box {
                padding: 22px;
            }

            .header h1 {
                font-size: 22px;
            }

        }

    </style>

</head>

<body>


    <!-- HEADER -->

    <div class="header">

        <h1>👨‍💼 Admin Dashboard</h1>

        <p>Edit Student Information</p>

    </div>


    <!-- MAIN CONTAINER -->

    <div class="container">

        <div class="box">

            <h2>✏️ Edit Student</h2>


            <!-- STUDENT ID -->

            <div class="student-id">

                <strong>Student ID:</strong>

                {{ student.get("student_id", "") }}

            </div>


            <form method="POST">


                <!-- STUDENT NAME -->

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="student_name"
                    value="{{ student.get('name', '') }}"
                    placeholder="Enter student name"
                    required
                >


                <!-- ENROLLMENT -->

                <label>
                    Enrollment Number
                </label>

                <input
                    type="text"
                    name="enrollment"
                    value="{{ student.get('enrollment', '') }}"
                    placeholder="Enter enrollment number"
                    required
                >


                <!-- COURSE -->

                <label>
                    Course
                </label>

                <select name="course" required>

                    <option value="">
                        Select Course
                    </option>

                    {% for course in courses %}

                        <option
                            value="{{ course }}"
                            {% if student.get("course", "")|lower == course|lower %}
                                selected
                            {% endif %}
                        >

                            {{ course }}

                        </option>

                    {% endfor %}

                </select>


                <div class="optional-note">

                    Course admin ke available courses me se select karein.

                </div>


                <!-- SEMESTER -->

                <label>
                    Semester
                </label>

                <select name="semester" required>

                    <option value="">
                        Select Semester
                    </option>

                    <option value="1"
                        {% if student.get("semester")|string == "1" %}
                            selected
                        {% endif %}>
                        1st Semester
                    </option>

                    <option value="2"
                        {% if student.get("semester")|string == "2" %}
                            selected
                        {% endif %}>
                        2nd Semester
                    </option>

                    <option value="3"
                        {% if student.get("semester")|string == "3" %}
                            selected
                        {% endif %}>
                        3rd Semester
                    </option>

                    <option value="4"
                        {% if student.get("semester")|string == "4" %}
                            selected
                        {% endif %}>
                        4th Semester
                    </option>

                    <option value="5"
                        {% if student.get("semester")|string == "5" %}
                            selected
                        {% endif %}>
                        5th Semester
                    </option>

                    <option value="6"
                        {% if student.get("semester")|string == "6" %}
                            selected
                        {% endif %}>
                        6th Semester
                    </option>

                    <option value="7"
                        {% if student.get("semester")|string == "7" %}
                            selected
                        {% endif %}>
                        7th Semester
                    </option>

                    <option value="8"
                        {% if student.get("semester")|string == "8" %}
                            selected
                        {% endif %}>
                        8th Semester
                    </option>

                </select>


                <!-- SECTION -->

                <label>

                    Section

                    <span class="optional">
                        (Optional)
                    </span>

                </label>

                <select name="section">

                    <option value="">
                        No Section
                    </option>

                    <option value="A"
                        {% if student.get("section", "")|upper == "A" %}
                            selected
                        {% endif %}>
                        Section A
                    </option>

                    <option value="B"
                        {% if student.get("section", "")|upper == "B" %}
                            selected
                        {% endif %}>
                        Section B
                    </option>

                    <option value="C"
                        {% if student.get("section", "")|upper == "C" %}
                            selected
                        {% endif %}>
                        Section C
                    </option>

                    <option value="D"
                        {% if student.get("section", "")|upper == "D" %}
                            selected
                        {% endif %}>
                        Section D
                    </option>

                </select>


                <!-- GROUP -->

                <label>

                    Group

                    <span class="optional">
                        (Optional)
                    </span>

                </label>

                <select name="group">

                    <option value="">
                        No Group
                    </option>

                    <option value="G1"
                        {% if student.get("group", "")|upper == "G1" %}
                            selected
                        {% endif %}>
                        Group G1
                    </option>

                    <option value="G2"
                        {% if student.get("group", "")|upper == "G2" %}
                            selected
                        {% endif %}>
                        Group G2
                    </option>

                    <option value="G3"
                        {% if student.get("group", "")|upper == "G3" %}
                            selected
                        {% endif %}>
                        Group G3
                    </option>

                    <option value="G4"
                        {% if student.get("group", "")|upper == "G4" %}
                            selected
                        {% endif %}>
                        Group G4
                    </option>

                </select>


                <!-- INFORMATION -->

                <div class="section-group-info">

                    <b>Note:</b><br>

                    Section ya Group agar nahi hai to
                    <b>No Section</b> / <b>No Group</b> hi rehne dein.
                    Dono options optional hain.

                </div>


                <!-- UPDATE BUTTON -->

                <button
                    type="submit"
                    class="update-btn"
                >

                    💾 Update Student

                </button>

            </form>


            <!-- BACK -->

            <a
                href="/admin-students"
                class="back-btn"
            >

                ← Back to Students

            </a>

        </div>

    </div>

</body>

</html>
