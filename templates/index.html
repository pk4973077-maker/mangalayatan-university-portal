<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>University Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 35px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 10px;
        }

        .main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .portals {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 170px;
            height: 170px;
            background: white;
            border-radius: 15px;
            text-align: center;
            padding: 20px;
            box-shadow: 0 5px 15px #cbd5e1;
            text-decoration: none;
            color: #1e293b;
            transition: 0.2s;
        }

        .card:hover {
            background: #dbeafe;
            transform: translateY(-5px);
        }

        .icon {
            font-size: 45px;
            margin-top: 15px;
        }

        .card h3 {
            margin: 15px 0 5px;
        }

        .card p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        /* =====================================
           STUDENT REGISTRATION QR CARD
        ===================================== */

        .qr-card {
            cursor: default;
            height: 230px;
            padding: 12px;
        }

        .qr-card:hover {
            background: white;
            transform: translateY(-5px);
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 5px auto;
        }

        .qr-container img {
            width: 125px;
            height: 125px;
            object-fit: contain;
            display: block;
        }

        .qr-card h3 {
            margin: 5px 0 4px;
            font-size: 16px;
        }

        .qr-card p {
            font-size: 12px;
            line-height: 1.3;
        }

        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .header h1 {
                font-size: 27px;
            }

            .main {
                margin: 25px auto;
                padding: 15px;
            }

            .portals {
                gap: 15px;
            }

            .card {
                width: 155px;
                height: 165px;
            }

            .qr-card {
                width: 155px;
                height: 220px;
            }

            .qr-container img {
                width: 115px;
                height: 115px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <h1>
            University Management
        </h1>

        <p>
            Complete University Management System
        </p>

    </div>


    <!-- =====================================
         MAIN
    ====================================== -->

    <div class="main">

        <h2 class="title">
            Select Your Portal
        </h2>


        <div class="portals">


            <!-- =================================
                 STUDENT LOGIN
            ================================== -->

            <a href="/student-login"
               class="card">

                <div class="icon">
                    🎓
                </div>

                <h3>
                    Student Login
                </h3>

                <p>
                    Student Portal
                </p>

            </a>


            <!-- =================================
                 FACULTY LOGIN
            ================================== -->

            <a href="/faculty-login"
               class="card">

                <div class="icon">
                    👨‍🏫
                </div>

                <h3>
                    Faculty Login
                </h3>

                <p>
                    Faculty Portal
                </p>

            </a>


            <!-- =================================
                 ADMIN PORTAL
            ================================== -->

            <a href="/admin-login"
               class="card">

                <div class="icon">
                    🏫
                </div>

                <h3>
                    Admin Portal
                </h3>

                <p>
                    University administration
                </p>

            </a>


            <!-- =================================
                 STUDENT REGISTRATION QR
            ================================== -->

            <div class="card qr-card">

                <div class="qr-container">

                    <img
                        src="/student-registration-qr"
                        alt="Student Registration QR Code"
                    >

                </div>

                <h3>
                    Student Registration
                </h3>

                <p>
                    📱 Scan QR to register
                </p>

            </div>


        </div>

    </div>


</body>

</html>
